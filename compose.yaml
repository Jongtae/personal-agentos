services:
  agentos:
    build: .
    image: personal-agentos:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AGENTOS_PORT:-8787}:8787"
    volumes:
      - agentos-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
volumes:
  agentos-data:
