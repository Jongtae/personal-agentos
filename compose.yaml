services:
  agentos:
    build: .
    image: personal-agentos:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AGENTOS_PORT:-8787}:8787"
    volumes:
      - agentos-data:/state
    environment:
      AGENTOS_ISOLATED_ENGINE_URL: http://engine:8766/execute
    networks:
      - default
      - engine-internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
  engine:
    build:
      context: .
      dockerfile: Dockerfile.engine
    image: personal-agentos-engine:local
    restart: unless-stopped
    command:
      - python
      - -m
      - personal_agent.isolated_engine_sidecar
      - --host
      - 0.0.0.0
      - --port
      - "8766"
      - --callback
      - http://agentos:8787/internal/isolated-engine/mcp
    volumes:
      - agentos-engine-profile:/engine-profile
    environment:
      HTTPS_PROXY: http://egress-proxy:3128
      HTTP_PROXY: http://egress-proxy:3128
      NO_PROXY: agentos,localhost,127.0.0.1
      https_proxy: http://egress-proxy:3128
      http_proxy: http://egress-proxy:3128
      no_proxy: agentos,localhost,127.0.0.1
    networks:
      - engine-internal
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  egress-proxy:
    build:
      context: .
      dockerfile: Dockerfile.egress
    image: personal-agentos-egress:local
    restart: unless-stopped
    environment:
      AGENTOS_PROVIDER_EGRESS_ALLOWLIST: ${AGENTOS_PROVIDER_EGRESS_ALLOWLIST:-}
    networks:
      - engine-internal
      - provider-egress
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
networks:
  default:
  engine-internal:
    internal: true
  provider-egress:
volumes:
  agentos-data:
  agentos-engine-profile:
