# Developer/self-hosted owner-runtime boundary. The consumer installer owns
# these values; owners do not share a Compose project or persistent volume.
services:
  agentos:
    build: ..
    image: personal-agentos:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AGENTOS_PORT:-8787}:8787"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    user: "10001:10001"
    tmpfs: [/tmp:uid=10001,gid=10001,mode=1777]
    volumes:
      - type: volume
        source: owner-data
        target: /data
      # Only an owner-approved snapshot belongs in this volume; never mount a Mac folder.
      - type: volume
        source: mediated-input
        target: /data/mediated-input
        read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
volumes:
  owner-data:
    name: agentos-owner-${AGENTOS_OWNER:?Set a safe owner identifier}
  mediated-input:
    name: agentos-mediated-input-${AGENTOS_OWNER:?Set a safe owner identifier}
