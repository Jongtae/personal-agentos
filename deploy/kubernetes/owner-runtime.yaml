# One rendered copy per owner. Replace OWNER_ID only after AgentOS validates it; do not put personal data or credentials in this manifest.
apiVersion: v1
kind: Namespace
metadata:
  name: agentos-OWNER_ID
  labels: {app.kubernetes.io/part-of: agentos}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentos-data
  namespace: agentos-OWNER_ID
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 10Gi}
---
# A companion may write owner-approved snapshots here. The AgentOS container
# receives this distinct volume read-only and never a hostPath source directory.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentos-mediated-input
  namespace: agentos-OWNER_ID
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentos
  namespace: agentos-OWNER_ID
spec:
  replicas: 1
  selector: {matchLabels: {app: agentos}}
  template:
    metadata: {labels: {app: agentos}}
    spec:
      automountServiceAccountToken: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
      containers:
        - name: agentos
          image: personal-agentos:managed
          args: ["start", "--host", "0.0.0.0", "--port", "8787", "--data", "/data", "--no-browser"]
          ports: [{containerPort: 8787}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: owner-data, mountPath: /data}
            - {name: mediated-input, mountPath: /data/mediated-input, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          readinessProbe: {httpGet: {path: /healthz, port: 8787}}
          livenessProbe: {httpGet: {path: /healthz, port: 8787}}
      volumes:
        - name: owner-data
          persistentVolumeClaim: {claimName: agentos-data}
        - name: mediated-input
          persistentVolumeClaim: {claimName: agentos-mediated-input}
        - name: tmp
          emptyDir: {}
---
# Default deny prevents direct engine networking. Later approved egress must be a narrow, separately tested policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: agentos-OWNER_ID
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
